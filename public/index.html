   <script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'en',
    includedLanguages: 'hi,en,mr,gu,pa,bn,ta,te,kn,ml',
    layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
    autoDisplay: false
  }, 'google_translate_element');

  // Protect language selector from being translated
  setTimeout(() => {
    document.querySelectorAll('.notranslate').forEach(el => {
      el.setAttribute('translate', 'no');
      el.querySelectorAll('*').forEach(child => {
        child.setAttribute('translate', 'no');
        child.classList.add('notranslate');
      });
    });
  }, 800);
}
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script>
  // Hide the Edge/Chrome browser translation bar by observing DOM changes
  const observer = new MutationObserver(() => {
    const bar = document.querySelector('.goog-te-banner-frame');
    if (bar) bar.style.display = 'none';
    document.body.style.top = '0px';
  });
  observer.observe(document.body, { childList: true, subtree: true });
</script>
